schema_version: 1
name: "讲义炼丹炉指令映射"
status: "active"
deployment: "GITHUB_REFERENCE"

purpose: >-
  使用双层架构将用户自然语言映射为完整、可审计的 Agent 执行协议。
  第一层只负责识别意图与选择内部指令；第二层必须执行完整步骤，
  不能因为用户表达简短就只做表面动作。

trigger:
  source: "user_message"
  mode: "contains"
  keyword: "炼丹炉"
  rule: >-
    只要用户本轮消息中出现连续字符串“炼丹炉”，无论是否带冒号、分号、竖线或标准格式，
    必须先执行 surface_router。讨论系统本身时也要路由为 SYSTEM_CONTROL 或规则咨询，
    不得误触发无关学习写入。

architecture:
  layer_1: "surface_router：理解自然语言，选择一个主入口和有顺序的内部指令。"
  layer_2: "protocol_executor：展开 global_protocol 与各命令 full_instruction，完成验证、写回和回执。"
  invariant: "用户不负责记忆、选择或维护内部指令；复杂性由 Agent 在项目后端承担。"

gateway_intents:
  SOURCE_INTAKE:
    label: "补充资料"
    examples:
      - "我上传了资料"
      - "这是新的试卷和答案"
      - "帮我清点文件"
    candidate_commands:
      - "SRC-AUTO"
      - "SRC-INVENTORY"
      - "SRC-SLIDES"
      - "SRC-EXERCISES"
      - "SRC-EXAMS"
      - "SRC-SOLUTIONS"
  LEARNING:
    label: "开始学习"
    examples:
      - "给我讲一下"
      - "带我做这道题"
      - "开始二轮复习"
    candidate_commands:
      - "LEARN-EXPLAIN"
      - "LEARN-GUIDED"
      - "REVIEW-PASS2"
      - "REVIEW-GAPS"
  ASSESSMENT:
    label: "检查掌握"
    examples:
      - "考考我"
      - "做一次模拟考试"
      - "看看 Loss 从哪里来"
    candidate_commands:
      - "LEARN-TEST"
      - "LEARN-MISTAKES"
      - "EXAM-MOCK"
      - "EXAM-GRADIENT"
      - "EXAM-ANALYZE"
  OUTPUT_MAINTENANCE:
    label: "整理成果"
    examples:
      - "整理一下刚才的内容"
      - "记录错题"
      - "生成开卷讲义"
    candidate_commands:
      - "OUTPUT-OPENBOOK"
      - "LEARN-MISTAKES"
      - "SRC-INVENTORY"
  SYSTEM_CONTROL:
    label: "系统与进度"
    examples:
      - "继续"
      - "查看进度"
      - "修正系统记录"
      - "调整目录"
      - "结束本次学习"
    candidate_commands:
      - "SYS-INIT"
      - "SYS-RESUME"
      - "SYS-STATUS"
      - "SYS-CORRECT"
      - "SYS-STRUCTURE"
      - "SYS-CLOSE"
      - "EXAM-SPRINT"

surface_router:
  procedure:
    - "读取整条用户消息、附件列表、最近对话和当前项目状态，不只截取‘炼丹炉’后的几个字。"
    - "确定一个 gateway intent 和一个主任务；必要时附加有明确先后顺序的子任务。"
    - "将任务映射到 commands 中已经定义的 canonical command；不得临时缩减其 full_instruction。"
    - "输出 routing_receipt；若无需确认，在回执后直接进入第二层执行。"
  routing_receipt:
    fields:
      - "识别任务：用户入口和具体目标"
      - "内部调用：规范指令或有顺序的指令链"
      - "关键约束：仅列本任务最重要且容易遗漏的规则"
      - "需要确认：无并开始执行，或一个确实影响结果的问题"
    brevity_rule: "正常不超过四项；不复制完整 global_protocol，也不展示内部 YAML。"
  confidence_policy:
    high: "给出路由回执后直接执行。"
    medium: "说明采用的假设；任务可撤销时直接执行，否则询问。"
    low: "询问一个最能消除歧义的问题，不让用户在完整内部命令列表中选择。"
  confirmation_required:
    - "删除或覆盖原始资料、学生原始作答或历史证据"
    - "移动、重命名或合并已有目录"
    - "改变状态文件结构或掌握度口径"
    - "同一句话存在会导致不同正式状态写入的解释"
  composition_rule:
    - "一次路由只能有一个主任务。"
    - "资料任务默认按清点与识别 → 分类导入 → 关系映射 → 必要分析执行。"
    - "学习任务默认按读取证据 → 教学或测试 → 验证 → 状态写回执行。"
    - "不得把内部命令选择工作转交给用户。"

syntax:
  canonical: "炼丹炉 + 任意自然语言需求"
  legacy: "炼丹炉：<指令>｜<可选参数>；"
  examples:
    - "炼丹炉：继续；"
    - "炼丹炉：导入试卷｜资料=本次上传；"
    - "炼丹炉：测试一下｜范围=当前章节｜题量=5；"
  prefix_aliases:
    - "炼丹炉："
    - "炼丹炉:"
  terminators:
    - "；"
    - ";"
  parameter_separator: "｜"
  parameter_assignment: "="

intent_resolution:
  order:
    - "优先匹配 canonical_phrase"
    - "其次匹配 aliases 中的近义短语"
    - "再根据动作、对象和当前上下文做语义匹配"
    - "若两个命令都可能导致不同文件写入，必须询问用户，不得猜测"
  normalization:
    - "忽略全角或半角冒号、分号差异"
    - "允许省略结尾分号"
    - "允许在指令后追加自然语言要求"
    - "允许省略可从当前项目状态可靠恢复的参数"
  confidence_policy:
    high: "按 surface_router 给出回执后直接执行"
    medium: "说明假设；可撤销时执行，不可撤销时询问"
    low: "只询问一个最关键的问题，不展示完整命令列表"

global_protocol:
  prepend_to_every_command:
    - "确认当前 GPT 能读取并写入用户提供的 GitHub 项目；若不能写入，立即报告，不得假装保存成功。"
    - "读取 AGENTS.md、COMMANDS.md、config/course.yaml、status/mastery.yaml、status/learner_profile.yaml、mistakes/mistakes.md、handoff/latest.md。"
    - "根据当前命令再读取相关 sources、kb、exercise、exam、tests 或 output 文件，不得只依赖聊天记忆。"
    - "检查 mastery 是否与最近测试、错题和交接记录一致；发现冲突时以可验证的新证据为准，并记录冲突。"
    - "用户只负责上传资料、作答和做必要选择；不得要求用户手动修改内部 YAML 或 Markdown。"
    - "所有来源结论必须标注可验证位置；无法确认的内容标记 UNVERIFIED。"
    - "完成后自动写回受影响文件，并返回人类可读回执：完成内容、证据、文件变化、未解决问题、下一步。"
  prohibited_behaviors:
    - "把听懂讲解直接等同于 PASS"
    - "把高 Loss 全部归因于学生本人，而不检查开卷资料的缺失与检索设计"
    - "用一次总分下降所有掌握维度，而不定位具体失效环节"
    - "根据一次错误建立长期学习画像"
    - "混淆独立习题与历年试题"
    - "未经核验覆盖官方资料或学生原始作答"
    - "声称已经更新实际未能写入的文件"

mastery_model:
  definition: >-
    掌握不是记住全部内容，而是在声明的考试条件下，能够稳定完成
    识别问题、回忆或检索方法、正确应用、检查结果并迁移到变式题的完整链条。
  principle: "拒绝内耗：失败表示联合系统中存在可更新参数，不等同于对个人能力的整体否定。"
  evaluation_contexts:
    open_book:
      name: "开卷结构化掌握"
      pass_condition: "在规定时间内独立完成识别 → 检索 → 应用 → 验证 → 迁移，并且只使用允许的开卷资料。"
    closed_book:
      name: "闭卷内化掌握"
      pass_condition: "在不检索资料时完成回忆 → 应用 → 验证；用于单独检查记忆和内化程度，不代替开卷联合系统测试。"
  dimensions:
    concept: "能解释核心含义、条件和相近概念差异。"
    recognition: "能从题干识别题型、已知条件、目标和第一步。"
    retrieval: "能在允许资料中快速找到正确入口，而不是只知道内容大概存在。"
    application: "能正确执行公式、算法或推导步骤。"
    verification: "能检查条件、单位、边界和结果合理性。"
    transfer: "能处理表述变化、参数变化或组合题。"
    material_support: "开卷资料覆盖必要内容，结构清楚，并能在时间限制内支持作答。"
  update_rule:
    - "每次测试按维度记录证据，不用单一分数替代掌握结构。"
    - "某一维度失败时只更新相关维度，不能无依据否定其他已验证能力。"
    - "PASS 必须声明考试条件；开卷 PASS 与闭卷 PASS 不得混写。"

loss_model:
  observed_loss:
    - "答案错误或不完整"
    - "超过规定时间"
    - "需要超出允许程度的提示"
    - "找到资料但无法直接应用"
    - "资料中没有必要内容或索引入口"
  gradient_sources:
    human_gradient:
      - "CONCEPT：概念或条件理解错误"
      - "RECOGNITION：未识别题型或第一步"
      - "FORMULA：公式选择或符号调用错误"
      - "CALCULATION：代数、数值或抄写错误"
      - "LANGUAGE：题干语言理解错误"
      - "VERIFICATION：未检查条件或结果合理性"
      - "TRANSFER：无法处理题目变式"
    material_gradient:
      - "MISSING：开卷资料缺少必要内容"
      - "INDEXING：知道内容存在但无法快速定位"
      - "CONDITION：公式或方法缺少适用条件"
      - "ACTIONABILITY：内容能读懂但不能直接指导作答"
      - "DENSITY：信息过长、重复或考试时不可扫描"
      - "EXAMPLE_GAP：例题不能覆盖当前变式"
      - "ERROR：资料本身存在错误或歧义"
  attribution_rule:
    - "对每个失分点分别标记 HUMAN、MATERIAL、BOTH 或 UNCERTAIN。"
    - "如果学生能口头说明方法但检索失败，优先检查 material gradient。"
    - "如果资料入口清楚但学生无法识别或应用，优先检查 human gradient。"
    - "证据不足时标记 UNCERTAIN，并设计最小验证题，不得武断归责。"
    - "更新参数后必须用同构或近似迁移题验证 Loss 是否下降。"

commands:
  - id: "SYS-INIT"
    canonical_phrase: "开新炉"
    aliases:
      - "初始化课程"
      - "新建课程"
      - "接管新课程"
      - "配置课程"
    parameters:
      optional:
        - "项目"
        - "目标"
        - "考试"
        - "资料"
    full_instruction:
      goal: "从用户提供的仓库链接和课程资料建立一个可继续学习的课程项目。"
      steps:
        - "检查目标仓库现有内容，保留用户文件，不做破坏性覆盖。"
        - "读取模板规则；缺少结构时由 GPT 自动创建。"
        - "识别课程名称、语言、考试形式、日期、题型和允许材料；只询问会实质改变计划的缺失信息，最多集中询问三项。"
        - "识别上传资料类型并登记 sources/manifest.yaml。"
        - "初始化章节、mastery、learner_profile、exam_map 和 handoff；未知内容保持空白，不得编造。"
        - "生成第一阶段学习计划，说明第一个可立即执行的任务。"
      writes:
        - "config/course.yaml"
        - "sources/manifest.yaml"
        - "status/mastery.yaml"
        - "status/learner_profile.yaml"
        - "exam/exam_map.md"
        - "handoff/latest.md"
      receipt: "报告已识别资料、课程结构、缺失信息和第一步；不向用户展示内部配置细节。"

  - id: "SYS-RESUME"
    canonical_phrase: "继续"
    aliases:
      - "继续学习"
      - "接着学"
      - "从上次继续"
      - "恢复进度"
      - "续炉"
    parameters:
      optional:
        - "范围"
        - "可用时间"
    full_instruction:
      goal: "在新窗口中完整恢复学习断点，而不是根据最近一条聊天消息草率继续。"
      steps:
        - "完整执行 global_protocol，不得跳过 handoff、mistakes 和近期 tests。"
        - "用最多五条简短信息报告：上次完成内容、有效证据、未解决问题、当前优先级、即将开始的动作。"
        - "若 handoff 与 mastery 冲突，先核对最近证据并修正状态。"
        - "直接开始下一项学习任务；只有存在多个同等优先选择时才询问用户。"
        - "本轮结束后更新 mastery、mistakes、learner_profile 和 handoff 中实际发生变化的部分。"
      writes:
        - "status/mastery.yaml"
        - "status/learner_profile.yaml"
        - "mistakes/mistakes.md"
        - "handoff/latest.md"
      receipt: "明确说明从哪个断点恢复，以及本轮新增了什么证据。"

  - id: "SYS-STATUS"
    canonical_phrase: "查看炉况"
    aliases:
      - "查看状态"
      - "学习进度"
      - "我学到哪了"
      - "当前情况"
      - "诊断进度"
    parameters:
      optional:
        - "范围"
    full_instruction:
      goal: "输出基于证据的学习状态，而不是直接倾倒内部文件。"
      steps:
        - "交叉读取 mastery、tests、mistakes、handoff 和 exam_map。"
        - "分别列出 PASS、PARTIAL、REVISIT 和 NOT_STARTED 的内容。"
        - "指出掌握判断的最近证据与可能过期的状态。"
        - "给出按考试价值排序的最多三个下一步动作。"
      writes: []
      receipt: "返回简洁状态摘要；除非发现明确冲突，否则不修改文件。"

  - id: "SYS-CORRECT"
    canonical_phrase: "修正炉况"
    aliases:
      - "纠正记录"
      - "改一下状态"
      - "这个判断不对"
      - "修正画像"
      - "更正进度"
    parameters:
      required:
        - "正确情况或需要修正的判断"
    full_instruction:
      goal: "修正错误的掌握度、错题、学习画像或交接记录。"
      steps:
        - "定位受影响文件和原判断的证据来源。"
        - "区分用户事实更正、状态过期和 AI 推断错误。"
        - "修改所有相互依赖的记录，避免只改一处造成矛盾。"
        - "保留必要的更正原因与日期，但不保留无关敏感信息。"
      writes:
        - "按实际影响更新 status、mistakes 或 handoff"
      receipt: "说明修改前后差异和受影响文件。"

  - id: "SYS-STRUCTURE"
    canonical_phrase: "调整结构"
    aliases:
      - "调整目录"
      - "修改目录"
      - "整理文件结构"
      - "新增文件夹"
      - "重构项目"
    parameters:
      optional:
        - "需求"
        - "目标结构"
    full_instruction:
      goal: "在不破坏学习证据和跨窗口恢复的前提下，按课程实际需要调整项目结构。"
      steps:
        - "先判断现有目录是否已经能够容纳需求；一次性输出或临时文件不得成为新顶层目录。"
        - "只有新内容具有独立、长期且明确的职责，或现有结构持续导致误分类和检索失败时，才建议调整。"
        - "列出调整原因、职责边界、受影响引用、迁移步骤和回滚方式。"
        - "新建普通文件或现有目录下的子目录可直接执行；新增顶层目录时先在路由回执中说明理由。"
        - "移动、重命名、合并或删除已有目录必须先取得用户确认。"
        - "执行后同步更新 README.md、AGENTS.md、COMMANDS.md、索引、链接和 handoff/latest.md，并检查断链。"
        - "使用独立 Git 提交保存结构调整，使其可以完整回滚。"
      writes:
        - "按批准方案调整项目目录"
        - "README.md"
        - "AGENTS.md"
        - "COMMANDS.md"
        - "handoff/latest.md"
      receipt: "报告调整理由、实际迁移、更新的引用、检查结果和回滚提交。"

  - id: "SYS-CLOSE"
    canonical_phrase: "收炉"
    aliases:
      - "结束学习"
      - "保存进度"
      - "今天到这里"
      - "写交接"
      - "结束本轮"
    parameters:
      optional:
        - "备注"
    full_instruction:
      goal: "在结束窗口前完成状态写回，使下一窗口可以可靠继续。"
      steps:
        - "汇总本轮真实完成的讲解、作答、测试和文件变更。"
        - "根据证据更新 mastery 和 mistakes；没有证据的内容不得升级状态。"
        - "仅在形成稳定模式时更新 learner_profile。"
        - "更新 handoff/latest.md：完成内容、证据、遗留问题、下一步和修改文件。"
        - "确认所有写入成功；失败项必须明确列出。"
      writes:
        - "status/mastery.yaml"
        - "status/learner_profile.yaml"
        - "mistakes/mistakes.md"
        - "handoff/latest.md"
      receipt: "返回简短收炉回执，并提示下一次只需使用‘炼丹炉：继续；’。"

  - id: "SRC-SLIDES"
    canonical_phrase: "导入课件"
    aliases:
      - "录入课件"
      - "读取讲义"
      - "加入 slides"
      - "整理课件"
      - "导入 PPT"
    parameters:
      optional:
        - "资料"
        - "章节"
    full_instruction:
      goal: "把上传的课程课件纳入来源体系并建立可学习的章节结构。"
      steps:
        - "识别文件、章节标题、页码范围和版本；原文件作为来源保留。"
        - "登记 manifest，区分官方课件与外部补充材料。"
        - "建立或更新 kb 章节骨架、术语表和知识点索引，但不假装学生已经掌握。"
        - "记录无法解析的页面、公式或图片，提示后续需要的处理。"
      writes:
        - "sources/manifest.yaml"
        - "kb/"
        - "vocabulary/glossary.md"
        - "handoff/latest.md"
      receipt: "报告新增章节、页数、未解析内容和建议学习入口。"

  - id: "SRC-EXERCISES"
    canonical_phrase: "导入习题"
    aliases:
      - "录入习题"
      - "加入练习"
      - "整理作业"
      - "导入练习题"
      - "读取习题册"
    parameters:
      optional:
        - "资料"
        - "章节"
    full_instruction:
      goal: "将独立习题按章节、题型和知识点建立映射，并与历年题分开。"
      steps:
        - "识别题号、章节、题型、知识点、难度和是否存在官方答案。"

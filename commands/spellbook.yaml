      steps:
        - "按 CONCEPT、RECOGNITION、FORMULA、CALCULATION、LANGUAGE、RETRIEVAL 分类。"
        - "区分孤立错误与重复模式，并核对原始作答证据。"
        - "对每类未关闭错误安排最小必要讲解和一道验证题。"
        - "验证通过后关闭错题；仍不稳定则更新下一步。"
      writes:
        - "mistakes/mistakes.md"
        - "tests/"
        - "status/mastery.yaml"
        - "status/learner_profile.yaml"
        - "handoff/latest.md"
      receipt: "报告关闭、未关闭和形成稳定模式的错误。"


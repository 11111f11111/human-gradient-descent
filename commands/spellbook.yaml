    full_instruction:
      goal: "基于历年试题证据分析考试结构、频率和复习优先级。"
      steps:
        - "确认已导入试卷的年份、完整度和是否存在答案。"
        - "按题目统计知识点、题型、分值和重复模式。"
        - "区分高频、低频、从未出现和资料不足。"
        - "结合学生掌握度形成个人化优先级，不把频率直接等同于必考。"

      optional:
        - "目标"
    full_instruction:
      goal: "在固定剩余时间内最大化预期得分，而不是试图完整重学课程。"
      steps:
        - "读取考试结构、历年频率、掌握度、错题和已完成开卷资料。"
        - "按得分概率、所需时间和风险分为必须做、可做、放弃。"
        - "安排具体时间块、验证节点和停止条件。"
        - "优先修复可快速转化为分数的识别、公式和检索问题。"
        - "保留必要休息和资料整理时间，不制定无法执行的满负荷计划。"
      writes:
        - "handoff/latest.md"
        - "必要时更新 output/openbook/"
      receipt: "给出可立即执行的时间表、拿分顺序和明确放弃项。"

  - id: "OUTPUT-OPENBOOK"
    canonical_phrase: "炼制讲义"
    aliases:
      - "生成开卷材料"
      - "压缩讲义"
      - "整理考试资料"
      - "导出开卷笔记"
      - "制作速查表"
    parameters:
      optional:
        - "范围"
        - "格式"
        - "页数限制"
    full_instruction:
      goal: "把经过理解、测试和纠正的内容压缩成考试时可快速检索的材料。"
      steps:
        - "只选择已有学习与测试证据支持的内容。"
        - "读取历次模拟考试中的 material gradient，把资料缺口和检索失败作为优先修订依据。"
        - "优先保留题型识别信号、必要公式与条件、固定步骤、易混对比、典型错误和来源定位。"
        - "详细推导留在 kb 或 exercise，通过目录和链接定位。"
        - "保持中文理解、英文术语和常见英文题干的对应。"
        - "若生成 PDF，保留 Markdown 主版本并进行可读性检查。"
      writes:
        - "output/openbook/"
        - "handoff/latest.md"
      receipt: "报告覆盖范围、修复的资料梯度、未纳入内容及原因、文件位置和检索结构。"

        - "先给整体逻辑，再详细解释困难、易混或高频部分。"
        - "保留关键英文术语并连接常见英文题干。"
        - "要求学生复述、判断或完成第一步，生成理解证据。"
        - "理解未确认时不得进入 PASS 或开卷资料。"

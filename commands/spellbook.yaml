        - "题型"
        - "开卷"
        - "难度"
    full_instruction:
      goal: "生成无答案提示的诊断测试，并在用户提交后完成基于证据的讲评。"
      steps:
        - "读取范围内 mastery、mistakes、kb、exercise 和 exam_map。"
        - "先说明范围、题量、题型、是否开卷和评分方式。"
        - "题目正文不附答案、公式定位或暗示性标题。"
        - "等待用户提交原始作答后再评分，不提前泄露解析。"
        - "按错误类型诊断，并区分独立完成、提示完成和未完成。"
        - "更新测试记录、错题和掌握度；一次正确不足以证明长期稳定。"
      writes:
        - "tests/"
        - "mistakes/mistakes.md"
        - "status/mastery.yaml"
        - "handoff/latest.md"
      receipt: "返回得分、证据、错误类型和下一步训练，不作无依据评价。"


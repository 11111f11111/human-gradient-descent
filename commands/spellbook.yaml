  - id: "EXAM-MOCK"
    canonical_phrase: "模拟考试"
    aliases:
      - "出模拟卷"
      - "全真测试"
      - "综合测试"
      - "按考试来一套"
      - "模考"
    parameters:
      optional:
        - "范围"
        - "时长"
        - "难度"
        - "资料版本"
    full_instruction:
      goal: "在当前开卷资料支持下测试‘学生 + 资料’联合系统，并从高 Loss 中寻找人的梯度与资料的梯度。"
      steps:
        - "读取真实考试形式、历年题分布、课程覆盖范围和当前 output/openbook。"
        - "记录本次使用的开卷资料版本；测试开始后不得先修改资料再掩盖原始 Loss。"
        - "生成原创或合规改编题，避免照抄受版权保护的完整试卷。"
        - "明确本次模拟允许并要求使用系统中的开卷资料；闭卷记忆检查应另用 LEARN-TEST。"
        - "先发布试卷、计时规则和资料使用记录方式，等待用户作答后再发布评分和解析。"
        - "记录每题用时、得分、检索入口、检索耗时和是否找到可直接执行的资料。"
        - "对每个失分点执行 loss_model：分别标记 HUMAN、MATERIAL、BOTH 或 UNCERTAIN。"
        - "人的梯度进入定向学习与练习；资料的梯度立即转化为明确的讲义修订任务。"
        - "完成更新后用同构或近似迁移题验证联合系统 Loss 是否下降。"
      writes:
        - "tests/"
        - "mistakes/mistakes.md"
        - "status/mastery.yaml"
        - "output/openbook/"
        - "handoff/latest.md"
      receipt: "返回模拟结果、人的梯度、资料的梯度、双方共同梯度、已更新参数和复测结果。"

  - id: "EXAM-GRADIENT"
    canonical_phrase: "寻找梯度"
    aliases:
      - "分析 Loss"
      - "反向传播"
      - "定位失分"
      - "为什么错这么多"
      - "从哪里改"
    parameters:
      optional:
        - "测试"
        - "范围"
    full_instruction:
      goal: "针对最近一次测试的 Loss，分别定位人的可更新参数和开卷资料的可更新参数。"
      steps:
        - "读取测试题、学生原始作答、用时、评分、资料版本和检索过程。"
        - "逐个失分点执行 loss_model，不以总分直接评价个人。"
        - "输出 human gradient：需要补的概念、识别、应用、计算、验证或迁移训练。"
        - "输出 material gradient：需要补充、重排、加索引、写条件、压缩或更正的资料位置。"
        - "选择能最大幅度降低 Loss 的最小更新，分别更新人和资料。"
        - "安排同构或近似迁移题复测；只有 Loss 实际下降才证明梯度方向有效。"
      writes:
        - "mistakes/mistakes.md"
        - "status/mastery.yaml"
        - "status/learner_profile.yaml"
        - "output/openbook/"
        - "tests/"
        - "handoff/latest.md"
      receipt: "返回逐项 Loss 归因、双侧梯度、更新内容、复测证据和仍未解释的 Loss。"

  - id: "EXAM-SPRINT"
    canonical_phrase: "冲刺规划"
    aliases:
      - "考前冲刺"
      - "抱佛脚"
      - "最后复习"
      - "剩余时间怎么学"
      - "拿分策略"
    parameters:
